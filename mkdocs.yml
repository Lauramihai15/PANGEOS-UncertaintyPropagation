site_name: PANGEOS Uncertainty Propagation — Case Studies
site_description: Worked examples of uncertainty propagation for multi-sensor optical measurements under sub-optimal field conditions
repo_url: https://github.com/Lauramihai15/PANGEOS-UncertaintyPropagation
repo_name: Lauramihai15/PANGEOS-UncertaintyPropagation

nav:
  - Home: index.md
  - Case studies:
      - "Case: Piccolo Doppio (FLMS/QEP)": case-piccolo.md
      - "Case: ASD & SVC": case-asd-svc.md
      - "Case: UAV sensors (Altum & REMX)": case-uav.md
      - "Case: cross-sensor intercomparison": case-intercomparison.md
  - Contributors: contributors.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
